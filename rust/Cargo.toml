[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", 
features = [
"postgres", 
"runtime-tokio", 
"uuid", 
"macros", 
"rust_decimal", 
"json", 
"chrono", 
"tls-rustls"] }

# no separate rust_decimal entry needed
dotenvy = "0.15"
phonenumber = "0.3"
oauth2 = { version = "4.4", features = ["reqwest"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
validator = { version = "0.19", features = ["derive"] }
anyhow = "1.0"
tower-sessions = "0.13"
tower-cookies = "0.11"   # for cookie handling
jsonwebtoken = "9"
time = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4.44"
chrono-tz = { version = "0.10", features = ["serde"] }
rustrict = "0.7"
fred = "10"
rust_decimal = "1"
rust_decimal_macros = "1"
rand = "0.8"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
aide = { version = "0.15", features = [
    "axum",
    "axum-json",
    "axum-query",
    "macros",
    "swagger"
] }
schemars = {version= "0.9", features = ["chrono04", "uuid1", "rust_decimal1"] }
resend-rs = "0.29.0"
tower-http ={version = "0.7.0", features = ["cors"]}
